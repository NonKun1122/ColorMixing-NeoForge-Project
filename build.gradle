plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.145'
}

version = '2.2.0'
group = 'com.nonkungch.colormix'

base {
    archivesName = 'colormix'
}

// Minecraft 1.21.1 ต้องการ Java 21
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', 'colormix'
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', 'colormix'
        programArgument '--nogui'
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    // อัปเดตเป็น NeoForge สำหรับ 1.21.1
    implementation "net.neoforged:neoforge:21.1.115"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        minecraft_version: "1.21.1",
        minecraft_version_range: "[1.21, 1.22)",
        neo_version: "21.1.115",
        loader_version_range: "[2,)",
        mod_id: "colormix",
        mod_name: "Color Mixing",
        mod_license: "MIT",
        mod_version: "2.2.0"
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'META-INF/mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
